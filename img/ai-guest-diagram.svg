  <circle cx="295" cy="329" r="3" fill="#2563eb"/>
  <text x="305" y="333" fill="#e2e8f0" font-size="13.5">Read or read + write</text>
  <circle cx="295" cy="357" r="3" fill="#2563eb"/>
  <text x="305" y="361" fill="#e2e8f0" font-size="13.5">Company write switch</text>
  <circle cx="295" cy="385" r="3" fill="#2563eb"/>
  <text x="305" y="389" fill="#e2e8f0" font-size="13.5">200 per minute</text>
  <text x="305" y="406" fill="#e2e8f0" font-size="13.5">per agent setup</text>
 </g>
 <line x1="470" y1="309.0" x2="497" y2="309.0" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#ar)"/>
 <g>
  <rect x="502" y="178" width="196" height="262" rx="16" fill="#0b1222" fill-opacity=".92" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.5"/>
  <rect x="502" y="178" width="196" height="5" rx="2.5" fill="#a78bfa"/>
  <circle cx="532" cy="212" r="14" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa"/><text x="532" y="217" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">3</text>
  <text x="520" y="254" fill="#ffffff" font-family="Poppins, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Same rules engine</text>
  <text x="520" y="275" fill="#a78bfa" font-size="12.5" font-weight="600">Shared with the app</text>
  <circle cx="526" cy="301" r="3" fill="#a78bfa"/>
  <text x="536" y="305" fill="#e2e8f0" font-size="13.5">Pay rules</text>
  <circle cx="526" cy="329" r="3" fill="#a78bfa"/>
  <text x="536" y="333" fill="#e2e8f0" font-size="13.5">Locks after payroll</text>
  <circle cx="526" cy="357" r="3" fill="#a78bfa"/>
  <text x="536" y="361" fill="#e2e8f0" font-size="13.5">Approvals</text>
  <circle cx="526" cy="385" r="3" fill="#a78bfa"/>
  <text x="536" y="389" fill="#e2e8f0" font-size="13.5">Corrections are</text>
  <text x="536" y="406" fill="#e2e8f0" font-size="13.5">new rows</text>
 </g>
 <line x1="701" y1="309.0" x2="728" y2="309.0" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#ar)"/>
 <g>
  <rect x="733" y="178" width="196" height="262" rx="16" fill="#0b1222" fill-opacity=".92" stroke="#f59e0b" stroke-opacity=".75" stroke-width="1.5"/>
  <rect x="733" y="178" width="196" height="5" rx="2.5" fill="#f59e0b"/>
  <circle cx="763" cy="212" r="14" fill="#f59e0b" fill-opacity=".18" stroke="#f59e0b"/><text x="763" y="217" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">4</text>
  <text x="751" y="254" fill="#ffffff" font-family="Poppins, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Audit trail</text>
  <text x="751" y="275" fill="#f59e0b" font-size="12.5" font-weight="600">Every write recorded</text>
  <circle cx="757" cy="301" r="3" fill="#f59e0b"/>
  <text x="767" y="305" fill="#e2e8f0" font-size="13.5">Who, what and when</text>
  <circle cx="757" cy="329" r="3" fill="#f59e0b"/>
  <text x="767" y="333" fill="#e2e8f0" font-size="13.5">API writes kept apart</text>
  <text x="767" y="350" fill="#e2e8f0" font-size="13.5">from human writes</text>
  <circle cx="757" cy="374" r="3" fill="#f59e0b"/>
  <text x="767" y="378" fill="#e2e8f0" font-size="13.5">Permanent history</text>
 </g>
 <line x1="932" y1="309.0" x2="959" y2="309.0" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#ar)"/>
 <g>
  <rect x="964" y="178" width="196" height="262" rx="16" fill="#0b1222" fill-opacity=".92" stroke="#10b981" stroke-opacity=".75" stroke-width="1.5"/>
  <rect x="964" y="178" width="196" height="5" rx="2.5" fill="#10b981"/>
  <circle cx="994" cy="212" r="14" fill="#10b981" fill-opacity=".18" stroke="#10b981"/><text x="994" y="217" text-anchor="middle" fill="#10b981" font-size="13" font-weight="700">5</text>
  <text x="982" y="254" fill="#ffffff" font-family="Poppins, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Your CRM data</text>
  <text x="982" y="275" fill="#10b981" font-size="12.5" font-weight="600">Founder owns it</text>
  <g stroke="#10b981" stroke-width="1.6" fill="#10b981" fill-opacity=".14"><path d="M1020.0 308 v58 a42 12 0 0 0 84 0 v-58"/><ellipse cx="1062.0" cy="308" rx="42" ry="12"/><path d="M1020.0 337 a42 12 0 0 0 84 0" fill="none"/></g>
  <text x="1062.0" y="400" text-anchor="middle" fill="#cbd5e1" font-size="13">Pay, orders and ledgers</text>
  <text x="1062.0" y="420" text-anchor="middle" fill="#cbd5e1" font-size="13">Works with or without AI</text>
 </g>
 <path d="M138.0 444 V500 H560" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="7 6"/>
 <path d="M640 500 H1062.0 V452" fill="none" stroke="#64748b" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 7"/>
 <circle cx="600" cy="500" r="22" fill="#2a0f17" stroke="#f43f5e" stroke-width="2.5"/>
 <path d="M590 490 L610 510 M610 490 L590 510" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>
 <text x="600" y="548" text-anchor="middle" fill="#fda4af" font-family="Poppins, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600">Blind direct DB write &#10005;  Blocked</text>
 <text x="600" y="570" text-anchor="middle" fill="#94a3b8" font-size="13.5">No skipping the API. No locks skipped, no silent edits to paid records, nothing outside the audit trail.</text>
 <text x="40" y="616" fill="#64748b" font-size="12">Switch the AI. Keep the rules.</text>
 <text x="1160" y="616" text-anchor="end" fill="#64748b" font-size="12">Jawad Ahmad</text>
</g>
</svg>